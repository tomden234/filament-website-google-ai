name: Build Android APK

# Baut aus der Web-App eine echte, installierbare Android-APK (Capacitor)
# und veröffentlicht sie als Release "apk-latest". Der QR-Code in der App zeigt auf diesen Download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Ohne steigende Version erkennt das Live-Update nie etwas Neues (live-version.json blieb dauerhaft auf 2.1.0).
      # Jetzt zählt jeder Build hoch, genau wie bei der Windows-App. Muss VOR dem Web-Build stehen, weil die Version in die App eingebaut wird.
      - name: Programm-Version hochzählen
        run: npm pkg set version=2.1.${{ github.run_number }}

      - name: Web-App bauen (App-Modus, Wurzel-Pfad)
        run: npm run build
        env:
          VITE_BASE: /
          VITE_STATIC: 'true'
          VITE_NATIVE: 'true'
          VITE_REPO: ${{ github.repository }}

      - name: Live-Update-Paket (Oberfläche ohne neue APK)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          (cd dist && zip -qr ../live-bundle.zip .)
          # nativeApi muss zu NATIVE_API in android-native/FilamentLivePlugin.java passen
          # 1.231: Prüfsumme des Pakets, die App verwirft halbe oder veränderte Downloads
          SHA=$(sha256sum live-bundle.zip | cut -d' ' -f1)
          echo "{\"version\":\"$VERSION\",\"nativeApi\":10,\"sha256\":\"$SHA\"}" > live-version.json
          cat live-version.json

      - name: Capacitor installieren (nur im Build, nicht im Projekt)
        run: |
          # Bis zu 3 Versuche (npm-Netz kann kurz ausfallen); bei Fehler die letzten Log-Zeilen als Annotation ausgeben
          for i in 1 2 3; do
            npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 && exit 0
            echo "Versuch $i fehlgeschlagen"
            sleep 15
          done
          tail -n 25 ~/.npm/_logs/*.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android
          # Eigenes Mini-Plugin: Web-App färbt Status- und Navigationsleiste passend zum Theme
          JAVA_DIR=android/app/src/main/java/com/filamenthub/app
          cp android-native/*.java "$JAVA_DIR/"
          # Homescreen-Widget (Layout, Hintergrund, Beschreibung)
          cp -r android-native/res/* android/app/src/main/res/
          # Paho MQTT (Drucker ohne Server) und NFC-Berechtigung
          sed -i '/^dependencies {/a\    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"' android/app/build.gradle
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # http im Heimnetz erlauben (Pi-Server 192.168.x.x:3000). Ohne das blockiert Android 9+ jeden http-Aufruf der App: „Server nicht erreichbar“, obwohl der Browser den Pi sieht.
          grep -q 'usesCleartextTraffic' "$MANIFEST" || sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          grep -n 'usesCleartextTraffic' "$MANIFEST" || echo "::warning::usesCleartextTraffic fehlt im Manifest"
          # Meldungen (Android 13+ braucht diese Berechtigung, sonst ist der Schalter in den Einstellungen grau/aus)
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.POST_PROMOTED_NOTIFICATIONS" />' "$MANIFEST"
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.NFC" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />' "$MANIFEST"
          # Bluetooth für den Etiketten-Drucker (Android 12+: Scan/Connect, älter: Standort für die Suche)
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />' "$MANIFEST"
          grep -n "BLUETOOTH_SCAN" "$MANIFEST" || echo "Hinweis: Bluetooth-Eintrag fehlt"
          # Hintergrund-Dienst: hält die Verbindung zum Drucker offen, damit Meldungen auch bei geschlossener App kommen
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />' "$MANIFEST"
          python3 - <<'PYWID'
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path, encoding="utf-8").read()
          rcv = (
              '        <receiver android:name="com.filamenthub.app.FilamentWidgetProvider" android:exported="false">\n'
              '            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n'
              '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/filament_widget_info" />\n'
              '        </receiver>\n'
          )
          if "FilamentWidgetProvider" in xml:
              print("Widget schon vorhanden")
          else:
              i = xml.find("</application>")
              if i < 0:
                  print("Hinweis: application im Manifest nicht gefunden, Widget fehlt")
              else:
                  open(path, "w", encoding="utf-8").write(xml[:i] + rcv + "    " + xml[i:])
                  print("Widget eingetragen")
          PYWID
          python3 - <<'PYSVC'
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path, encoding="utf-8").read()
          svc = (
              '        <service android:name="com.filamenthub.app.FilamentKeepAliveService" android:exported="false" android:foregroundServiceType="specialUse">\n'
              '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Verbindung zum 3D-Drucker offen halten, damit Meldungen (Trocknung, Druck fertig) ankommen" />\n'
              '        </service>\n'
          )
          if "FilamentKeepAliveService" in xml:
              print("Hintergrund-Dienst schon vorhanden")
          else:
              i = xml.find("</application>")
              if i < 0:
                  print("Hinweis: application im Manifest nicht gefunden, Hintergrund-Dienst fehlt")
              else:
                  xml = xml[:i] + svc + "    " + xml[i:]
                  open(path, "w", encoding="utf-8").write(xml)
                  print("Hintergrund-Dienst eingetragen")
          PYSVC
          grep -n "FilamentKeepAliveService\|FOREGROUND_SERVICE" "$MANIFEST" || echo "Hinweis: Hintergrund-Dienst fehlt im Manifest"
          # Einfarbiges Spulen-Symbol für Meldungen (Android zeigt Meldungs-Symbole nur als Umriss, das bunte App-Symbol wäre ein weißes Quadrat)
          mkdir -p android/app/src/main/res/drawable
          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FFFFFFFF" android:pathData="M12,2 A10,10 0 1,1 12,22 A10,10 0 1,1 12,2 Z M12,5 A7,7 0 1,0 12,19 A7,7 0 1,0 12,5 Z M12,6.3 A5.7,5.7 0 1,1 12,17.7 A5.7,5.7 0 1,1 12,6.3 Z M12,9.5 A2.5,2.5 0 1,0 12,14.5 A2.5,2.5 0 1,0 12,9.5 Z" />\n</vector>\n' > android/app/src/main/res/drawable/ic_stat_spool.xml
          # Dateifreigabe für den Installer (Cache-Ordner mit der geladenen APK)
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <external-path name="my_images" path="." />\n    <cache-path name="my_cache_images" path="." />\n    <files-path name="my_files" path="." />\n</paths>\n' > android/app/src/main/res/xml/file_paths.xml
          grep -n "fileprovider" "$MANIFEST" || echo "Hinweis: FileProvider fehlt im Manifest"
          grep -n "NFC\|INSTALL_PACKAGES" "$MANIFEST" || echo "Hinweis: NFC-Eintrag fehlt"
          # NFC-Tags der App öffnen die App direkt (statt Androids „Neuer Tag erkannt“-Fenster), auch wenn sie nicht vorne ist
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:xliff="urn:oasis:names:tc:xliff:document:1.2">\n    <tech-list><tech>android.nfc.tech.Ndef</tech></tech-list>\n    <tech-list><tech>android.nfc.tech.NdefFormatable</tech></tech-list>\n    <tech-list><tech>android.nfc.tech.NfcA</tech><tech>android.nfc.tech.MifareUltralight</tech></tech-list>\n</resources>\n' > android/app/src/main/res/xml/nfc_tech_filter.xml
          python3 - <<'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path, encoding="utf-8").read()
          filters = (
              '        <intent-filter><action android:name="android.nfc.action.NDEF_DISCOVERED" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="application/opentag3d" /></intent-filter>\n'
              '        <intent-filter><action android:name="android.nfc.action.NDEF_DISCOVERED" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/plain" /></intent-filter>\n'
              '        <intent-filter><action android:name="android.nfc.action.TECH_DISCOVERED" /><category android:name="android.intent.category.DEFAULT" /></intent-filter>\n'
              '        <meta-data android:name="android.nfc.action.TECH_DISCOVERED" android:resource="@xml/nfc_tech_filter" />\n'
          )
          if "NDEF_DISCOVERED" in xml:
              print("NFC-Filter schon vorhanden")
          else:
              i = xml.find("</activity>")
              if i < 0:
                  print("Hinweis: Activity im Manifest nicht gefunden, NFC-Filter fehlen")
              else:
                  xml = xml[:i] + filters + "    " + xml[i:]
                  open(path, "w", encoding="utf-8").write(xml)
                  print("NFC-Filter eingetragen")
          PYEOF
          grep -n "NDEF_DISCOVERED\|TECH_DISCOVERED" "$MANIFEST" || echo "Hinweis: NFC-Filter fehlen"
          # QR-Etiketten: Link filamenthub://spool/ID und die Seiten-Adresse öffnen die App direkt bei der Spule
          python3 - <<'PYLINK'
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path, encoding="utf-8").read()
          links = (
              '        <intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="filamenthub" android:host="spool" /></intent-filter>\n'
              '        <intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="https" android:host="%s.github.io" android:pathPrefix="/%s" /></intent-filter>\n'
          )
          import os
          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          links = links % (owner.lower(), name)
          if 'android:scheme="filamenthub"' in xml:
              print("Spulen-Links schon vorhanden")
          else:
              i = xml.find("</activity>")
              if i < 0:
                  print("Hinweis: Activity im Manifest nicht gefunden, Spulen-Links fehlen")
              else:
                  xml = xml[:i] + links + "    " + xml[i:]
                  open(path, "w", encoding="utf-8").write(xml)
                  print("Spulen-Links eingetragen")
          PYLINK
          grep -n 'android:scheme="filamenthub"' "$MANIFEST" || echo "Hinweis: Spulen-Links fehlen"
          grep -n "paho" android/app/build.gradle || echo "Hinweis: Paho fehlt"
          # Inhalt nicht unter die Systemleisten zeichnen (Menü oben links bleibt sichtbar), Leistenfarben sind einstellbar
          for st in AppTheme AppTheme.NoActionBar AppTheme.NoActionBarLaunch; do
            sed -i "/<style name=\"$st\"/a\        <item name=\"android:windowOptOutEdgeToEdgeEnforcement\">true</item>" android/app/src/main/res/values/styles.xml || echo "Hinweis: Theme nicht gefunden, Systemleisten bleiben Standard"
          done
          grep -n "windowOptOutEdgeToEdgeEnforcement" android/app/src/main/res/values/styles.xml || echo "Hinweis: Theme nicht gefunden, Systemleisten bleiben Standard"
          # Eigenes App-Icon statt Standard-Icon
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/pwa-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp public/pwa-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp public/pwa-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Signierte Release-APK bauen
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_SECRET_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Signierschlüssel nur aus den Secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD (1.229: der alte Schlüssel im Repo war öffentlich).
          # Ohne Secrets wird keine neue APK gebaut: das Live-Update (Oberfläche) läuft trotzdem, die bisherige APK bleibt im Release.
          KS_FILE="$RUNNER_TEMP/filamenthub.keystore"
          if [ -z "$KS_B64" ] || [ -z "$KS_SECRET_PASS" ]; then
            echo "::warning::Keine APK gebaut: Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASSWORD fehlen. Live-Update läuft trotzdem."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$KS_FILE"
          KS_PASS="$KS_SECRET_PASS"
          echo "Signierschlüssel: aus Secret"
          VERSION=$(node -p "require('../package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=filamenthub \
            -Pandroid.injected.signing.key.password="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../FilamentHub.apk

      - name: APK als Artefakt speichern
        if: hashFiles('FilamentHub.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FilamentHub-apk
          path: FilamentHub.apk

      - name: Release "apk-latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Keine neue APK (Secrets fehlen): die bisherige aus dem Release behalten
          if [ ! -f FilamentHub.apk ]; then gh release download apk-latest -p FilamentHub.apk || true; fi
          ASSETS="live-bundle.zip live-version.json"
          if [ -f FilamentHub.apk ]; then ASSETS="FilamentHub.apk $ASSETS"; fi
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest $ASSETS \
            --title "FilamentHub APK v$VERSION" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Auf dem Handy installieren (Unbekannte Quellen erlauben)." \
            --latest
