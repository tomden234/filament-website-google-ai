name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typprüfung: seit v1.73 fehlerfrei, darum jetzt blockierend (neue Fehler fallen sofort auf)
      - name: Typprüfung
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Geheimnis-Scanner (1.230): schlägt fehl, wenn Token, Passwörter oder Schlüssel im Code stehen.
  # Prüft den aktuellen Stand (nicht die alte Historie), damit so etwas nie wieder unbemerkt eingecheckt wird.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: gitleaks laden und prüfen
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --no-banner --redact
